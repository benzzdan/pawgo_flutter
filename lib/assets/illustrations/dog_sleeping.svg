<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Sleeping/relaxed dog on cushion - cozy, warm style -->
  <!-- Cushion -->
  <ellipse cx="100" cy="155" rx="70" ry="20" fill="#FFF5E6" stroke="#4A2C2A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cushion stripes -->
  <path d="M50 155 Q100 145 150 155" fill="none" stroke="#F4A832" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M55 160 Q100 152 145 160" fill="none" stroke="#F4A832" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <!-- Body (curled up) -->
  <ellipse cx="100" cy="125" rx="50" ry="25" fill="#C07D4D" stroke="#4A2C2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head (resting) -->
  <circle cx="135" cy="110" r="24" fill="#C07D4D" stroke="#4A2C2A" stroke-width="3" stroke-linecap="round"/>
  <!-- Left ear (draped down, relaxed) -->
  <path d="M118 98 Q108 85 105 100 Q104 108 115 106" fill="#C07D4D" stroke="#4A2C2A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right ear (flat on surface) -->
  <path d="M152 100 Q165 88 168 105 Q170 112 155 110" fill="#C07D4D" stroke="#4A2C2A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner ear -->
  <path d="M112 96 Q108 90 108 100" fill="none" stroke="#F4A832" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M158 98 Q163 92 165 104" fill="none" stroke="#F4A832" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Snout (resting on paws) -->
  <ellipse cx="145" cy="120" rx="11" ry="8" fill="#FFF5E6" stroke="#4A2C2A" stroke-width="2" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="148" cy="117" rx="4" ry="3" fill="#4A2C2A"/>
  <!-- Eyes (closed, sleeping) -->
  <path d="M128 106 Q132 104 136 106" fill="none" stroke="#4A2C2A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M142 108 Q146 106 150 108" fill="none" stroke="#4A2C2A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Front paw (chin resting on it) -->
  <ellipse cx="155" cy="130" rx="8" ry="4" fill="#F4A832" stroke="#4A2C2A" stroke-width="2"/>
  <ellipse cx="140" cy="132" rx="8" ry="4" fill="#F4A832" stroke="#4A2C2A" stroke-width="2"/>
  <!-- Back paw (peeking out) -->
  <ellipse cx="55" cy="138" rx="6" ry="3.5" fill="#F4A832" stroke="#4A2C2A" stroke-width="2"/>
  <!-- Tail (curled around body) -->
  <path d="M52 120 Q40 115 42 130 Q44 140 55 135" fill="none" stroke="#4A2C2A" stroke-width="3" stroke-linecap="round"/>
  <path d="M52 120 Q42 117 44 130 Q46 138 55 134" fill="none" stroke="#C07D4D" stroke-width="2"/>
  <!-- Collar (visible on neck) -->
  <path d="M118 115 Q130 120 148 114" fill="none" stroke="#F4A832" stroke-width="3" stroke-linecap="round"/>
  <!-- Zzz sleep marks -->
  <text x="160" y="90" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F4A832" opacity="0.7">z</text>
  <text x="170" y="78" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F4A832" opacity="0.5">z</text>
  <text x="178" y="68" font-family="sans-serif" font-size="9" font-weight="bold" fill="#F4A832" opacity="0.3">z</text>
</svg>
