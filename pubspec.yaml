name: pawgo
description: Pawgo - Dog Walking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0
  supabase_flutter: ^2.12.0
  purchases_flutter: ^8.6.0
  google_maps_flutter: ^2.12.0
  geolocator: ^13.0.2
  image_picker: ^1.2.1
  google_mobile_ads: ^5.3.0
  posthog_flutter: ^4.7.1
  google_sign_in: ^7.2.0
  flutter_svg: ^2.0.17
  confetti: ^0.8.0
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.3
  lottie: ^3.3.1
  phosphor_flutter: ^2.1.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  plugin_platform_interface: ^2.1.0
  fake_async: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/illustrations/
    - assets/illustrations/corgi_lying.png
    - assets/illustrations/corgi_sitting.png
    - assets/illustrations/corgi_wagging.png
    - assets/illustrations/corgi_celebration.gif
